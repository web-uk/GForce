name: Validate and deploy GForce
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  GFORCE_BROWSER_CHANNEL: chrome
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GFORCE_TEST_BUILD: "1"
          VITE_ONESIGNAL_APP_ID: "00000000-0000-4000-8000-000000000001"
      - name: Usar Chrome estável já instalado no runner
        run: google-chrome --version
      - run: npm run test:e2e
      - name: Build de produção sem credencial de teste
        run: npm run build && node scripts/check-production-verifier.mjs
        env:
          GFORCE_TEST_BUILD: "0"
          # Apenas configuração pública; a chave privada não participa do build.
          VITE_ONESIGNAL_APP_ID: ${{ vars.GFORCE_ONESIGNAL_APP_ID }}
          VITE_REMINDER_TIMEZONE: ${{ vars.GFORCE_REMINDER_TIMEZONE || 'America/Sao_Paulo' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-published:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Usar Chrome estável já instalado no runner
        run: google-chrome --version
      - name: Open published URL and verify real app
        run: node tests/published-smoke.mjs
        env:
          GFORCE_URL: ${{ needs.deploy.outputs.page_url }}
          GFORCE_TEST_PASSWORD: ${{ secrets.GFORCE_TEST_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-browser-evidence
          path: test-results/published/
